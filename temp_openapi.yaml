
openapi: 3.1.0
info:
  title: ProyectoOneDrive / RedVecina API
  version: 0.1.0
  description: >-
    API contrato-primero alineada a schema_sqlite.sql, RF01-RF25 y RNF (offline-first,
    idempotencia, privacidad por aproximación, accesibilidad, moderación y emergencia).
servers:
  - url: /api/v1
tags:
  - name: auth
  - name: servicios
  - name: favores
  - name: emergencias
  - name: alertas
  - name: anuncios
  - name: sync
  - name: Soporte
paths:
  /auth/sesion:
    post:
      tags: [auth]
      summary: Iniciar sesión con celular/alias y PIN o contraseña
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador]
              properties:
                identificador: { type: string }
                pin: { type: string }
                password: { type: string }
      responses:
        '200': { description: Sesión creada }
        '401': { description: Credenciales inválidas, content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
  /servicios:
    get:
      tags: [servicios]
      summary: Buscar servicios por zona/categoría
      parameters:
        - in: query
          name: zona_id
          schema: { type: string }
        - in: query
          name: categoria
          schema: { $ref: '#/components/schemas/CategoriaServicio' }
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Lista paginada }
    post:
      tags: [servicios]
      summary: Publicar servicio (RF05)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioInput' }
      responses:
        '201': { description: Creado }
        '409': { description: Conflicto/idempotencia }
  /servicios/{id}/recomendaciones:
    post:
      tags: [servicios]
      summary: Registrar evento de visto bueno/retiro (append-only RF07/RF08)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecomendacionInput' }
      responses:
        '201': { description: Evento registrado }
  /favores:
    get:
      tags: [favores]
      summary: Listar favores por zona/estado
      parameters:
        - in: query
          name: zona_id
          schema: { type: string }
        - in: query
          name: estado
          schema: { $ref: '#/components/schemas/EstadoFavor' }
      responses:
        '200': { description: Lista }
    post:
      tags: [favores]
      summary: Publicar favor (RF09)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavorInput' }
      responses:
        '201': { description: Creado }
  /favores/{id}/confirmaciones:
    post:
      tags: [favores]
      summary: Confirmar cierre mutuo "Se cumplió" (RF11, append-only)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavorConfirmacionInput' }
      responses:
        '201': { description: Confirmación registrada }
  /emergencias:
    post:
      tags: [emergencias]
      summary: Activar emergencia de zona (RF12, coordinador)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmergenciaInput' }
      responses:
        '201': { description: Emergencia activada }
  /alertas:
    get:
      tags: [alertas]
      summary: Tablero de alertas humanitarias (RF13-RF15)
      parameters:
        - in: query
          name: zona_id
          schema: { type: string }
      responses:
        '200': { description: Lista }
    post:
      tags: [alertas]
      summary: Reportar necesidad con ubicación aproximada (RF13/RF19)
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertaInput' }
      responses:
        '201': { description: Alerta registrada }
  /anuncios:
    get:
      tags: [anuncios]
      summary: Anuncios locales visibles; ocultos en emergencia (RF21/RF22)
      parameters:
        - in: query
          name: zona_id
          schema: { type: string }
      responses:
        '200': { description: Lista filtrada por visibilidad }
  /sync/push:
    post:
      tags: [sync]
      summary: Recibir operaciones outbox idempotentes (RF17/RF18)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operaciones]
              properties:
                operaciones:
                  type: array
                  items: { $ref: '#/components/schemas/SyncOperacion' }
      responses:
        '200': { description: Resultado por operación }
  /sync/pull:
    get:
      tags: [sync]
      summary: Descargar cambios desde cursor
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
      responses:
        '200': { description: Cambios + nuevo cursor }
  /zonas/{id}/paquete:
    get:
      tags: [Soporte]
      summary: Descargar paquete de tablas de zona para uso offline (paginado y reanudable)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: limite
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Paquete de zona con progreso de descarga
          content:
            application/json:
              schema:
                type: object
                required: [tablas, siguiente, progreso]
                properties:
                  tablas:
                    type: array
                    items: { type: string }
                  siguiente:
                    type: string
                    nullable: true
                  progreso:
                    type: integer
                    minimum: 0
                    maximum: 100
components:
  parameters:
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8 }
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
    CategoriaServicio:
      type: string
      enum: [gasfiteria, carpinteria, electricidad, cerrajeria, clases, paseo_mascotas, comida, costura, reparaciones, cuidado, otro]
    EstadoFavor:
      type: string
      enum: [abierto, en_curso, cerrado, cancelado]
    ServicioInput:
      type: object
      required: [zona_id, categoria, titulo, descripcion, lat_aprox, lng_aprox]
      properties:
        zona_id: { type: string }
        categoria: { $ref: '#/components/schemas/CategoriaServicio' }
        titulo: { type: string, minLength: 3, maxLength: 80 }
        descripcion: { type: string, maxLength: 500 }
        es_emprendimiento: { type: boolean }
        lat_aprox: { type: number }
        lng_aprox: { type: number }
    RecomendacionInput:
      type: object
      required: [tipo, misma_zona, dispositivo_hash]
      properties:
        tipo: { type: string, enum: [visto_bueno, retiro] }
        comentario: { type: string, maxLength: 140 }
        misma_zona: { type: boolean }
        dispositivo_hash: { type: string }
    FavorInput:
      type: object
      required: [zona_id, tipo, categoria, titulo, descripcion, lat_aprox, lng_aprox]
      properties:
        zona_id: { type: string }
        tipo: { type: string, enum: [oferta, necesidad] }
        categoria: { type: string }
        titulo: { type: string, minLength: 3, maxLength: 80 }
        descripcion: { type: string, maxLength: 500 }
        lat_aprox: { type: number }
        lng_aprox: { type: number }
    FavorConfirmacionInput:
      type: object
      required: [rol_en_favor, metodo]
      properties:
        rol_en_favor: { type: string, enum: [solicitante, ayudante] }
        metodo: { type: string, enum: [qr, boton] }
    EmergenciaInput:
      type: object
      required: [zona_id, tipo, titulo]
      properties:
        zona_id: { type: string }
        tipo: { type: string }
        titulo: { type: string }
    AlertaInput:
      type: object
      required: [zona_id, tipo, descripcion, lat_aprox, lng_aprox]
      properties:
        emergencia_id: { type: string, nullable: true }
        zona_id: { type: string }
        tipo: { type: string }
        descripcion: { type: string, maxLength: 300 }
        lat_aprox: { type: number }
        lng_aprox: { type: number }
    SyncOperacion:
      type: object
      required: [op_id, entidad, operacion, payload]
      properties:
        op_id: { type: string }
        entidad: { type: string }
        operacion: { type: string, enum: [crear, actualizar] }
        payload: { type: object, additionalProperties: true }
