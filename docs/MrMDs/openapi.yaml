openapi: 3.0.3
info:
  title: AYNI API
  version: 2.0.0
  description: |
    Contrato entre el backend y el frontend `ayni-app` (React). Reemplaza a `src/storage.js`:
    cada colección de localStorage tiene su endpoint (ver docs/MAPEO_FRONTEND.md).
    Reglas generales:
    - Los IDs son UUID y los genera el CLIENTE (así se puede crear sin conexión).
    - Las ubicaciones son aproximadas (máx. 3 decimales). `direccion_referencia` es privada: nunca se devuelve.
    - El teléfono de un vecino solo se muestra a vecinos de su mismo sector (para abrir WhatsApp).
    - Recomendaciones (Visto Bueno) son append-only: se crean una vez, nunca se editan ni se borran.
    - Lo hecho sin conexión se envía en lote por POST /sync/push (idempotente por `op_id`).
    - Errores: siempre `{ codigo, mensaje }` con un texto simple para mostrar al vecino.
servers:
  - url: /api/v1
tags:
  - { name: Auth }
  - { name: Sectores }
  - { name: Usuarios }
  - { name: Servicios, description: "Servicios y productos + Visto Bueno" }
  - { name: Favores, description: "Cadena de Favores" }
  - { name: Moderacion }
  - { name: Emergencia }
  - { name: Sync, description: "Offline-first" }
security:
  - bearerAuth: []

paths:
  # ------------------------------------------------------------ AUTH
  /auth/otp/solicitar:
    post:
      tags: [Auth]
      security: []
      operationId: solicitarCodigo
      summary: Enviar un código SMS (en la demo el código es 1234)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telefono]
              properties:
                telefono: { $ref: '#/components/schemas/Telefono' }
      responses:
        '202': { description: Código enviado; no revela si el teléfono ya existe }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
  /auth/otp/verificar:
    post:
      tags: [Auth]
      security: []
      operationId: verificarCodigo
      summary: Verificar el código. Si el teléfono ya tiene cuenta devuelve una sesión; si no, un token de registro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [telefono, codigo]
              properties:
                telefono: { $ref: '#/components/schemas/Telefono' }
                codigo: { type: string, minLength: 4, maxLength: 6 }
                plataforma: { $ref: '#/components/schemas/Plataforma' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultado' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
  /auth/registro:
    post:
      tags: [Auth]
      operationId: registrarVecino
      summary: Crear la cuenta (usa el token de registro). Puede crear un sector nuevo y volver Guardián al fundador
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegistroRequest' }
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResultado' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Invalido' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: miPerfil
      summary: Mi cuenta
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '401': { $ref: '#/components/responses/NoAutorizado' }
  /auth/logout:
    post:
      tags: [Auth]
      operationId: cerrarSesion
      summary: Cerrar sesión (revoca el token)
      responses:
        '204': { description: Sesión cerrada }

  # ------------------------------------------------------------ SECTORES
  /sectores:
    get:
      tags: [Sectores]
      security: []
      operationId: listarSectores
      summary: Sectores disponibles para elegir al registrarse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sector' }
  /sectores/{sectorId}:
    parameters: [{ $ref: '#/components/parameters/SectorId' }]
    get:
      tags: [Sectores]
      operationId: detalleSector
      summary: Un sector con sus manzanas y Guardianes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sector' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------ USUARIOS
  /usuarios/me:
    patch:
      tags: [Usuarios]
      operationId: actualizarMiPerfil
      summary: Cambiar mis ajustes (nombre completo visible, idioma, letra grande, manzana)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mostrar_nombre_completo: { type: boolean }
                idioma: { $ref: '#/components/schemas/Idioma' }
                letra_grande: { type: boolean }
                manzana: { $ref: '#/components/schemas/Manzana' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '422': { $ref: '#/components/responses/Invalido' }
  /usuarios/me/invitacion-guardian:
    post:
      tags: [Usuarios]
      operationId: responderInvitacionGuardian
      summary: Aceptar o dejar para después la invitación a ser Guardián (se ofrece a los 60 días)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [respuesta]
              properties:
                respuesta: { type: string, enum: [aceptada, despues] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usuario' }
        '409': { description: Aún no cumples 60 días en AYNI, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /usuarios/{usuarioId}:
    parameters: [{ $ref: '#/components/parameters/UsuarioId' }]
    get:
      tags: [Usuarios]
      operationId: perfilVecino
      summary: Perfil de un vecino con su Balance de Ayni
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PerfilVecino' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  # ------------------------------------------------------------ SERVICIOS
  /servicios:
    get:
      tags: [Servicios]
      operationId: listarServicios
      summary: Servicios y productos de mi sector (los más recomendados primero)
      parameters:
        - { name: categoria, in: query, schema: { $ref: '#/components/schemas/CategoriaServicio' } }
        - { name: clase, in: query, schema: { $ref: '#/components/schemas/ClaseServicio' } }
        - { name: q, in: query, description: Texto libre sobre título y descripción, schema: { type: string, maxLength: 60 } }
        - { name: solo_recomendados, in: query, schema: { type: boolean, default: false } }
        - { $ref: '#/components/parameters/Mios' }
        - { $ref: '#/components/parameters/Limite' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Solo publicaciones visibles (y las mías, aunque estén pausadas)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
                  siguiente_cursor: { type: string, nullable: true }
    post:
      tags: [Servicios]
      operationId: crearServicio
      summary: Publicar un servicio o producto (3 clics)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioNuevo' }
      responses:
        '201':
          description: Creado (si el id ya existe devuelve el mismo registro)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
  /servicios/{servicioId}:
    parameters: [{ $ref: '#/components/parameters/ServicioId' }]
    get:
      tags: [Servicios]
      operationId: detalleServicio
      summary: Detalle con etiquetas más votadas y comentarios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Servicios]
      operationId: editarServicio
      summary: Editar, pausar o reactivar mi servicio (la última escritura gana)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServicioEdicion' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Servicio' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    delete:
      tags: [Servicios]
      operationId: eliminarServicio
      summary: Eliminar mi publicación (borrado lógico)
      responses:
        '204': { description: Eliminado }
        '403': { $ref: '#/components/responses/Prohibido' }
  /servicios/{servicioId}/contacto:
    parameters: [{ $ref: '#/components/parameters/ServicioId' }]
    post:
      tags: [Servicios]
      operationId: registrarContacto
      summary: Anotar que le escribí por WhatsApp (para preguntar después "¿Te atendió?")
      responses:
        '201':
          description: Contacto abierto (si ya había uno sin responder, devuelve ese)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
        '422': { $ref: '#/components/responses/Invalido' }
  /contactos/pendientes:
    get:
      tags: [Servicios]
      operationId: contactosPendientes
      summary: Contactos que aún no respondí ("¿Te atendió…?")
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Contacto' } }
  /contactos/{contactoId}:
    parameters:
      - { name: contactoId, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Servicios]
      operationId: responderContacto
      summary: Responder "¿Te atendió?"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [atendido]
              properties:
                atendido: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contacto' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /servicios/{servicioId}/recomendaciones:
    parameters: [{ $ref: '#/components/parameters/ServicioId' }]
    get:
      tags: [Servicios]
      operationId: listarRecomendaciones
      summary: Vistos Buenos de un servicio
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Recomendacion' } }
    post:
      tags: [Servicios]
      operationId: darVistoBueno
      summary: Dar mi Visto Bueno (solo si me atendieron; una vez por servicio; 1 a 6 etiquetas)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecomendacionNueva' }
      responses:
        '201':
          description: Registrado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recomendacion' }
        '403': { description: Aún no puedes recomendar este servicio (no te atendieron o es el tuyo), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ------------------------------------------------------------ FAVORES
  /favores:
    get:
      tags: [Favores]
      operationId: listarFavores
      summary: Muro de favores de mi sector
      parameters:
        - { name: tipo, in: query, schema: { $ref: '#/components/schemas/TipoFavor' } }
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoFavor' } }
        - { $ref: '#/components/parameters/Mios' }
        - { $ref: '#/components/parameters/Limite' }
        - { $ref: '#/components/parameters/Cursor' }
      responses:
        '200':
          description: Antes de responder, el servidor libera las reservas de más de 1 hora
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Favor' } }
                  siguiente_cursor: { type: string, nullable: true }
    post:
      tags: [Favores]
      operationId: crearFavor
      summary: Pido, presto, regalo o intercambio
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavorNuevo' }
      responses:
        '201':
          description: Creado (si el id ya existe devuelve el mismo registro)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favor' }
        '422': { $ref: '#/components/responses/Invalido' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
  /favores/{favorId}:
    parameters: [{ $ref: '#/components/parameters/FavorId' }]
    get:
      tags: [Favores]
      operationId: detalleFavor
      summary: Detalle de un favor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favor' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    patch:
      tags: [Favores]
      operationId: editarFavor
      summary: Editar mi favor mientras está disponible
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FavorEdicion' }
      responses:
        '200':
          description: Actualizado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favor' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
    delete:
      tags: [Favores]
      operationId: eliminarFavor
      summary: Eliminar mi publicación (borrado lógico)
      responses:
        '204': { description: Eliminado }
        '403': { $ref: '#/components/responses/Prohibido' }
  /favores/{favorId}/reservar:
    parameters: [{ $ref: '#/components/parameters/FavorId' }]
    post:
      tags: [Favores]
      operationId: reservarFavor
      summary: "Lo quiero / Puedo ayudar: reserva por 1 hora (gana el primero)"
      responses:
        '200':
          description: Reservado para mí
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favor' }
        '409': { $ref: '#/components/responses/Conflicto' }
        '422': { $ref: '#/components/responses/Invalido' }
  /favores/{favorId}/liberar:
    parameters: [{ $ref: '#/components/parameters/FavorId' }]
    post:
      tags: [Favores]
      operationId: liberarFavor
      summary: Soltar la reserva (el dueño o quien reservó)
      responses:
        '200':
          description: Vuelve a estar disponible
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favor' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /favores/{favorId}/listo:
    parameters: [{ $ref: '#/components/parameters/FavorId' }]
    post:
      tags: [Favores]
      operationId: confirmarFavor
      summary: Botón "Listo". Cuando ambos lo pulsan el favor se cierra y suma al Balance de Ayni
      responses:
        '200':
          description: Confirmación registrada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Favor' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }

  # ------------------------------------------------------------ MODERACIÓN
  /reportes:
    post:
      tags: [Moderacion]
      operationId: reportarPublicacion
      summary: Reportar un servicio o favor (con 3 reportes pendientes se oculta solo)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReporteNuevo' }
      responses:
        '201': { description: Gracias. Un Guardián lo revisará }
        '409': { $ref: '#/components/responses/Conflicto' }
  /moderacion/pendientes:
    get:
      tags: [Moderacion]
      operationId: panelModeracion
      summary: Panel del Guardián, publicaciones con reportes pendientes
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PendienteModeracion' } }
        '403': { $ref: '#/components/responses/Prohibido' }
  /moderacion/resolver:
    post:
      tags: [Moderacion]
      operationId: resolverModeracion
      summary: El Guardián decide si la publicación se queda (aprobar) o se oculta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [objeto_tipo, objeto_id, decision]
              properties:
                objeto_tipo: { type: string, enum: [servicio, favor] }
                objeto_id: { type: string, format: uuid }
                decision: { type: string, enum: [aprobar, ocultar] }
      responses:
        '200': { description: Resuelto }
        '403': { $ref: '#/components/responses/Prohibido' }

  # ------------------------------------------------------------ EMERGENCIA
  /emergencias:
    get:
      tags: [Emergencia]
      operationId: listarEmergencias
      summary: Emergencias de mi sector (el Guardián ve las pendientes)
      parameters:
        - { name: estado, in: query, schema: { $ref: '#/components/schemas/EstadoEmergencia' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Emergencia' } }
    post:
      tags: [Emergencia]
      operationId: reportarEmergencia
      summary: Cualquier vecino reporta; queda pendiente hasta que un Guardián confirme
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmergenciaNueva' }
      responses:
        '201':
          description: Reporte enviado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Emergencia' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }
  /emergencias/activa:
    get:
      tags: [Emergencia]
      operationId: emergenciaActiva
      summary: ¿Hay una emergencia activa en mi sector? (la app lo consulta al abrir)
      responses:
        '200':
          description: La emergencia activa o null
          content:
            application/json:
              schema:
                type: object
                nullable: true
                allOf: [{ $ref: '#/components/schemas/Emergencia' }]
  /emergencias/{emergenciaId}:
    parameters: [{ $ref: '#/components/parameters/EmergenciaId' }]
    get:
      tags: [Emergencia]
      operationId: detalleEmergencia
      summary: Detalle, con cuántos vecinos respondieron
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Emergencia' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
  /emergencias/{emergenciaId}/confirmar:
    parameters: [{ $ref: '#/components/parameters/EmergenciaId' }]
    post:
      tags: [Emergencia]
      operationId: confirmarEmergencia
      summary: Un Guardián confirma → pasa a activa y se avisa a todos
      responses:
        '200':
          description: Activa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Emergencia' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /emergencias/{emergenciaId}/descartar:
    parameters: [{ $ref: '#/components/parameters/EmergenciaId' }]
    post:
      tags: [Emergencia]
      operationId: descartarEmergencia
      summary: Un Guardián descarta explicando el motivo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, minLength: 3, maxLength: 200 }
      responses:
        '200':
          description: Descartada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Emergencia' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /emergencias/{emergenciaId}/atender:
    parameters: [{ $ref: '#/components/parameters/EmergenciaId' }]
    post:
      tags: [Emergencia]
      operationId: cerrarEmergencia
      summary: Un Guardián marca la emergencia como atendida (termina el modo emergencia)
      responses:
        '200':
          description: Atendida
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Emergencia' }
        '403': { $ref: '#/components/responses/Prohibido' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /emergencias/{emergenciaId}/acuse:
    parameters: [{ $ref: '#/components/parameters/EmergenciaId' }]
    put:
      tags: [Emergencia]
      operationId: acusarEmergencia
      summary: Mi respuesta a la alerta (visto, estoy bien, necesito ayuda) y si ya vi el aviso de fin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                respuesta: { $ref: '#/components/schemas/RespuestaAlerta' }
                fin_visto: { type: boolean }
                reportero_visto: { type: boolean, description: Solo lo puede marcar quien reportó }
      responses:
        '204': { description: Guardado }
        '403': { $ref: '#/components/responses/Prohibido' }
  /emergencias/{emergenciaId}/pedidos:
    parameters: [{ $ref: '#/components/parameters/EmergenciaId' }]
    get:
      tags: [Emergencia]
      operationId: listarPedidos
      summary: Pedidos de ayuda de esta emergencia (para el mapa)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/PedidoAyuda' } }
    post:
      tags: [Emergencia]
      operationId: pedirAyuda
      summary: "Necesito ayuda: agua, comida, salud, rescate, refugio"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoAyudaNuevo' }
      responses:
        '201':
          description: Pedido publicado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoAyuda' }
        '409': { description: No hay una emergencia activa, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /pedidos/{pedidoId}/ayudar:
    parameters: [{ $ref: '#/components/parameters/PedidoId' }]
    post:
      tags: [Emergencia]
      operationId: ayudarPedido
      summary: Voy en camino (gana el primero)
      responses:
        '200':
          description: En camino
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoAyuda' }
        '409': { $ref: '#/components/responses/Conflicto' }
  /pedidos/{pedidoId}/resolver:
    parameters: [{ $ref: '#/components/parameters/PedidoId' }]
    post:
      tags: [Emergencia]
      operationId: resolverPedido
      summary: Quien pidió marca que ya lo resolvió
      responses:
        '200':
          description: Resuelto
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PedidoAyuda' }
        '403': { $ref: '#/components/responses/Prohibido' }
  /grupos-apoyo:
    get:
      tags: [Emergencia]
      operationId: directorioApoyo
      summary: Directorio de servicios y grupos de apoyo de mi sector (también offline)
      parameters:
        - { name: recurso, in: query, schema: { $ref: '#/components/schemas/RecursoApoyo' } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/GrupoApoyo' } }

  # ------------------------------------------------------------ SYNC
  /sync/push:
    post:
      tags: [Sync]
      operationId: enviarOperaciones
      summary: Enviar en lote lo hecho sin conexión
      description: |
        Idempotente: un `op_id` ya procesado responde "duplicada" y no se aplica otra vez.
        Cada operación se evalúa por separado; una rechazada no bloquea a las demás.
        Conflictos: servicios y favores (edición) → gana la última escritura; reservar un favor → gana el primero;
        recomendaciones y reportes → solo se agregan; emergencias → manda el servidor (el Guardián decide).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operaciones]
              properties:
                operaciones:
                  type: array
                  maxItems: 100
                  items: { $ref: '#/components/schemas/OperacionSync' }
      responses:
        '200':
          description: Resultado por operación
          content:
            application/json:
              schema:
                type: object
                required: [resultados]
                properties:
                  resultados: { type: array, items: { $ref: '#/components/schemas/ResultadoSync' } }
  /sync/pull:
    get:
      tags: [Sync]
      operationId: descargarCambios
      summary: Descargar lo que cambió en mi sector desde la última vez
      parameters:
        - { name: desde, in: query, description: "Usa el 'hasta' de la descarga anterior; sin él, descarga todo", schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Cambios agrupados por tabla, para guardar en SQLite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CambiosSync' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token opaco; en la base solo se guarda su hash (sesiones.token_hash)
  parameters:
    SectorId: { name: sectorId, in: path, required: true, schema: { type: string, format: uuid } }
    UsuarioId: { name: usuarioId, in: path, required: true, schema: { type: string, format: uuid } }
    ServicioId: { name: servicioId, in: path, required: true, schema: { type: string, format: uuid } }
    FavorId: { name: favorId, in: path, required: true, schema: { type: string, format: uuid } }
    EmergenciaId: { name: emergenciaId, in: path, required: true, schema: { type: string, format: uuid } }
    PedidoId: { name: pedidoId, in: path, required: true, schema: { type: string, format: uuid } }
    Mios: { name: mios, in: query, description: Solo mis propias publicaciones, schema: { type: boolean, default: false } }
    Limite: { name: limite, in: query, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
    Cursor: { name: cursor, in: query, schema: { type: string } }
  responses:
    Invalido: { description: Datos inválidos, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NoAutorizado: { description: Falta iniciar sesión o el código es incorrecto, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Prohibido: { description: No tienes permiso para esto, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NoEncontrado: { description: No existe, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Conflicto: { description: Conflicto con el estado actual, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    LimiteExcedido: { description: Demasiadas peticiones, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }

  schemas:
    Error:
      type: object
      required: [codigo, mensaje]
      properties:
        codigo: { type: string, example: RESERVA_OCUPADA }
        mensaje: { type: string, description: "Texto simple, apto para mostrar al vecino" }
    # ---------- catálogos (idénticos a src/data.js y a los CHECK de la base)
    Telefono: { type: string, pattern: '^519[0-9]{8}$', example: '51900000001', description: "51 + 9 dígitos" }
    Manzana: { type: string, pattern: '^[A-J]$' }
    Idioma: { type: string, enum: [es, en, qu] }
    Plataforma: { type: string, enum: [android, ios, web, otro], default: web }
    CategoriaServicio: { type: string, enum: [gasfiteria, electricidad, carpinteria, cerrajeria, mascotas, clases, costura, comida, otros] }
    ClaseServicio: { type: string, enum: [servicio, producto] }
    Etiqueta: { type: string, enum: [puntual, precio, limpio, amable, rapido, volveria] }
    TipoFavor: { type: string, enum: [pido, presto, regalo, intercambio] }
    EstadoFavor: { type: string, enum: [disponible, reservado, cerrado] }
    Moderacion: { type: string, enum: [visible, en_revision, oculto] }
    MotivoReporte: { type: string, enum: [estafa, falso, ofensivo, mala_experiencia, otro] }
    TipoEmergencia: { type: string, enum: [inundacion, incendio, sismo, servicios, accidente, otro] }
    EstadoEmergencia: { type: string, enum: [pendiente, activa, descartada, atendida] }
    RespuestaAlerta: { type: string, enum: [visto, bien, ayuda] }
    Necesidad: { type: string, enum: [agua, comida, salud, rescate, refugio, otro] }
    Vulnerable: { type: string, enum: [adulto, ninos, discapacidad, gestante, mascotas] }
    EstadoPedido: { type: string, enum: [abierto, en_camino, resuelto] }
    RecursoApoyo: { type: string, enum: [agua, refugio, salud, comida, energia, traslado] }

    # ---------- acceso y usuarios
    AuthResultado:
      type: object
      required: [tipo, token]
      properties:
        tipo: { type: string, enum: [sesion, registro], description: "'registro' = el teléfono es nuevo y falta crear la cuenta" }
        token: { type: string }
        usuario: { $ref: '#/components/schemas/Usuario' }
    RegistroRequest:
      type: object
      required: [nombre, apellido, manzana]
      description: Enviar `sector_id` (unirse) o `sector_nuevo` (crearlo y ser su primer Guardián)
      properties:
        nombre: { type: string, minLength: 2, maxLength: 40 }
        apellido: { type: string, maxLength: 40 }
        manzana: { $ref: '#/components/schemas/Manzana' }
        sector_id: { type: string, format: uuid }
        sector_nuevo:
          type: object
          required: [id, nombre, manzanas]
          properties:
            id: { type: string, format: uuid }
            nombre: { type: string, minLength: 3, maxLength: 80 }
            manzanas: { type: array, minItems: 1, maxItems: 10, items: { $ref: '#/components/schemas/Manzana' } }
        lat_aprox: { type: number, minimum: -90, maximum: 90 }
        lng_aprox: { type: number, minimum: -180, maximum: 180 }
        direccion_referencia: { type: string, maxLength: 120, description: Privada; nunca se devuelve }
        idioma: { $ref: '#/components/schemas/Idioma' }
        plataforma: { $ref: '#/components/schemas/Plataforma' }
    Usuario:
      type: object
      required: [id, nombre, apellido, telefono, sector_id, manzana, idioma, es_guardian, dias_en_ayni, creado_en]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        apellido: { type: string }
        telefono: { $ref: '#/components/schemas/Telefono' }
        sector_id: { type: string, format: uuid }
        manzana: { $ref: '#/components/schemas/Manzana' }
        lat_aprox: { type: number, nullable: true }
        lng_aprox: { type: number, nullable: true }
        verificado: { type: boolean }
        mostrar_nombre_completo: { type: boolean }
        invitacion_guardian: { type: string, enum: [aceptada, despues, fundador], nullable: true }
        idioma: { $ref: '#/components/schemas/Idioma' }
        letra_grande: { type: boolean }
        rol_plataforma: { type: string, enum: [usuario, admin] }
        es_guardian: { type: boolean, description: Derivado de sector_guardianes }
        dias_en_ayni: { type: integer, minimum: 0, description: Derivado de creado_en }
        creado_en: { type: string, format: date-time }
        actualizado_en: { type: string, format: date-time }
    VecinoPublico:
      type: object
      required: [id, nombre_visible, manzana]
      properties:
        id: { type: string, format: uuid }
        nombre_visible: { type: string, example: "Rosa M.", description: "Nombre y apellido completos solo si el vecino lo eligió" }
        manzana: { $ref: '#/components/schemas/Manzana' }
        telefono: { $ref: '#/components/schemas/Telefono' }
        es_guardian: { type: boolean }
    PerfilVecino:
      allOf:
        - $ref: '#/components/schemas/VecinoPublico'
        - type: object
          properties:
            creado_en: { type: string, format: date-time }
            balance_ayni:
              type: object
              properties:
                dados: { type: integer, minimum: 0 }
                recibidos: { type: integer, minimum: 0 }
    Sector:
      type: object
      required: [id, nombre, manzanas]
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        manzanas: { type: array, items: { $ref: '#/components/schemas/Manzana' } }
        guardianes: { type: array, items: { $ref: '#/components/schemas/VecinoPublico' } }
        fundador_id: { type: string, format: uuid, nullable: true }
        total_vecinos: { type: integer, minimum: 0 }
        creado_en: { type: string, format: date-time }

    # ---------- servicios
    ServicioNuevo:
      type: object
      required: [id, clase, categoria, titulo, descripcion, horario]
      properties:
        id: { type: string, format: uuid }
        clase: { $ref: '#/components/schemas/ClaseServicio' }
        categoria: { $ref: '#/components/schemas/CategoriaServicio' }
        titulo: { type: string, minLength: 3, maxLength: 40 }
        descripcion: { type: string, minLength: 10, maxLength: 200 }
        horario: { type: string, minLength: 1 }
        precio: { type: string, nullable: true, example: "S/ 30" }
        foto: { type: string, nullable: true, description: URL o imagen JPEG comprimida (máx. 480 px) }
        mostrar_nombre_completo: { type: boolean, default: false }
    ServicioEdicion:
      type: object
      properties:
        clase: { $ref: '#/components/schemas/ClaseServicio' }
        categoria: { $ref: '#/components/schemas/CategoriaServicio' }
        titulo: { type: string, minLength: 3, maxLength: 40 }
        descripcion: { type: string, minLength: 10, maxLength: 200 }
        horario: { type: string, minLength: 1 }
        precio: { type: string, nullable: true }
        foto: { type: string, nullable: true }
        mostrar_nombre_completo: { type: boolean }
        estado: { type: string, enum: [disponible, pausado] }
        actualizado_en: { type: string, format: date-time, description: "Hora del dispositivo, para resolver la última escritura gana" }
    Servicio:
      allOf:
        - $ref: '#/components/schemas/ServicioNuevo'
        - type: object
          required: [dueno_id, estado, moderacion, total_vistos_buenos, creado_en]
          properties:
            dueno_id: { type: string, format: uuid }
            dueno: { $ref: '#/components/schemas/VecinoPublico' }
            estado: { type: string, enum: [disponible, pausado] }
            moderacion: { $ref: '#/components/schemas/Moderacion' }
            total_vistos_buenos: { type: integer, minimum: 0, description: count(recomendaciones) }
            etiquetas:
              type: array
              description: Más votadas primero (v_servicio_etiquetas)
              items:
                type: object
                required: [etiqueta, cantidad]
                properties:
                  etiqueta: { $ref: '#/components/schemas/Etiqueta' }
                  cantidad: { type: integer }
            distancia_cuadras: { type: integer, minimum: 0, description: "Calculado con la diferencia de letras de manzana; no se guarda" }
            creado_en: { type: string, format: date-time }
            actualizado_en: { type: string, format: date-time }
    Contacto:
      type: object
      required: [id, servicio_id, usuario_id, respondido, creado_en]
      properties:
        id: { type: string, format: uuid }
        servicio_id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        respondido: { type: boolean }
        atendido: { type: boolean, nullable: true }
        creado_en: { type: string, format: date-time }
    RecomendacionNueva:
      type: object
      required: [id, etiquetas]
      properties:
        id: { type: string, format: uuid }
        etiquetas: { type: array, minItems: 1, maxItems: 6, uniqueItems: true, items: { $ref: '#/components/schemas/Etiqueta' } }
        comentario: { type: string, maxLength: 200, default: "" }
    Recomendacion:
      type: object
      required: [id, servicio_id, usuario_id, etiquetas, creado_en]
      properties:
        id: { type: string, format: uuid }
        servicio_id: { type: string, format: uuid }
        usuario_id: { type: string, format: uuid }
        autor: { $ref: '#/components/schemas/VecinoPublico' }
        etiquetas: { type: array, items: { $ref: '#/components/schemas/Etiqueta' } }
        comentario: { type: string }
        creado_en: { type: string, format: date-time }

    # ---------- favores
    DetallesFavor:
      type: object
      description: |
        Según el tipo. presto: duracion, condicion · regalo: estado, cantidad ·
        intercambio: ofrezco, busco · pido: clase, cuando
      additionalProperties: { type: string }
    FavorNuevo:
      type: object
      required: [id, tipo, titulo]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoFavor' }
        titulo: { type: string, minLength: 3 }
        detalles: { $ref: '#/components/schemas/DetallesFavor' }
        foto: { type: string, nullable: true }
    FavorEdicion:
      type: object
      properties:
        titulo: { type: string, minLength: 3 }
        detalles: { $ref: '#/components/schemas/DetallesFavor' }
        foto: { type: string, nullable: true }
        actualizado_en: { type: string, format: date-time }
    Favor:
      allOf:
        - $ref: '#/components/schemas/FavorNuevo'
        - type: object
          required: [dueno_id, estado, moderacion, creado_en]
          properties:
            dueno_id: { type: string, format: uuid }
            dueno: { $ref: '#/components/schemas/VecinoPublico' }
            estado: { $ref: '#/components/schemas/EstadoFavor' }
            moderacion: { $ref: '#/components/schemas/Moderacion' }
            tomador_id: { type: string, format: uuid, nullable: true }
            tomador: { allOf: [{ $ref: '#/components/schemas/VecinoPublico' }], nullable: true }
            reservado_en: { type: string, format: date-time, nullable: true }
            minutos_restantes: { type: integer, nullable: true, description: "De la reserva de 1 hora; calculado" }
            dueno_confirmo: { type: boolean }
            tomador_confirmo: { type: boolean }
            cerrado_en: { type: string, format: date-time, nullable: true }
            creado_en: { type: string, format: date-time }
            actualizado_en: { type: string, format: date-time }

    # ---------- moderación
    ReporteNuevo:
      type: object
      required: [id, objeto_tipo, objeto_id, motivo]
      properties:
        id: { type: string, format: uuid }
        objeto_tipo: { type: string, enum: [servicio, favor] }
        objeto_id: { type: string, format: uuid }
        motivo: { $ref: '#/components/schemas/MotivoReporte' }
    PendienteModeracion:
      type: object
      required: [objeto_tipo, objeto_id, total_reportes]
      properties:
        objeto_tipo: { type: string, enum: [servicio, favor] }
        objeto_id: { type: string, format: uuid }
        total_reportes: { type: integer, minimum: 1 }
        titulo: { type: string }
        dueno: { $ref: '#/components/schemas/VecinoPublico' }
        motivo_principal: { $ref: '#/components/schemas/MotivoReporte' }
        primer_reporte: { type: string, format: date-time }

    # ---------- emergencia
    EmergenciaNueva:
      type: object
      required: [id, tipo]
      properties:
        id: { type: string, format: uuid }
        tipo: { $ref: '#/components/schemas/TipoEmergencia' }
        texto: { type: string, maxLength: 200, default: "" }
        foto: { type: string, nullable: true }
    Emergencia:
      allOf:
        - $ref: '#/components/schemas/EmergenciaNueva'
        - type: object
          required: [sector_id, reportero_id, manzana, estado, creado_en]
          properties:
            sector_id: { type: string, format: uuid }
            reportero_id: { type: string, format: uuid }
            reportero: { $ref: '#/components/schemas/VecinoPublico' }
            manzana: { $ref: '#/components/schemas/Manzana' }
            estado: { $ref: '#/components/schemas/EstadoEmergencia' }
            confirmada_por: { type: string, format: uuid, nullable: true }
            confirmada_en: { type: string, format: date-time, nullable: true }
            motivo_descarte: { type: string, nullable: true }
            revisada_por: { type: string, format: uuid, nullable: true }
            revisada_en: { type: string, format: date-time, nullable: true }
            atendida_en: { type: string, format: date-time, nullable: true }
            cerrada_por: { type: string, format: uuid, nullable: true }
            reportero_visto: { type: boolean }
            mi_respuesta: { allOf: [{ $ref: '#/components/schemas/RespuestaAlerta' }], nullable: true }
            fin_visto: { type: boolean }
            resumen:
              type: object
              description: Conteos del Panel del Guardián (emergencia_acuses y pedidos_ayuda)
              properties:
                a_salvo: { type: integer }
                necesitan_ayuda: { type: integer }
                pedidos_abiertos: { type: integer }
                vecinos_en_sector: { type: integer }
            creado_en: { type: string, format: date-time }
            actualizado_en: { type: string, format: date-time }
    PedidoAyudaNuevo:
      type: object
      required: [id, necesidad]
      properties:
        id: { type: string, format: uuid }
        necesidad: { $ref: '#/components/schemas/Necesidad' }
        vulnerables: { type: array, uniqueItems: true, items: { $ref: '#/components/schemas/Vulnerable' } }
        cuantas: { type: integer, minimum: 1, maximum: 99, default: 1 }
        texto: { type: string, maxLength: 200, default: "" }
        foto: { type: string, nullable: true }
    PedidoAyuda:
      allOf:
        - $ref: '#/components/schemas/PedidoAyudaNuevo'
        - type: object
          required: [emergencia_id, dueno_id, manzana, estado, creado_en]
          properties:
            emergencia_id: { type: string, format: uuid }
            dueno_id: { type: string, format: uuid }
            dueno: { $ref: '#/components/schemas/VecinoPublico' }
            manzana: { $ref: '#/components/schemas/Manzana' }
            estado: { $ref: '#/components/schemas/EstadoPedido' }
            ayudante_id: { type: string, format: uuid, nullable: true }
            ayudante: { allOf: [{ $ref: '#/components/schemas/VecinoPublico' }], nullable: true }
            ayudante_en: { type: string, format: date-time, nullable: true }
            resuelto_en: { type: string, format: date-time, nullable: true }
            creado_en: { type: string, format: date-time }
            actualizado_en: { type: string, format: date-time }
    GrupoApoyo:
      type: object
      required: [id, sector_id, emoji, nombre, contacto_tipo, contacto_valor]
      properties:
        id: { type: string, format: uuid }
        sector_id: { type: string, format: uuid }
        emoji: { type: string }
        nombre: { type: string }
        meta: { type: string }
        recurso: { allOf: [{ $ref: '#/components/schemas/RecursoApoyo' }], nullable: true }
        manzana: { type: string, nullable: true, pattern: '^[A-J]$' }
        contacto_tipo: { type: string, enum: [tel, wa] }
        contacto_valor: { type: string, pattern: '^[0-9]{3,12}$' }
        creado_en: { type: string, format: date-time }

    # ---------- sync
    OperacionSync:
      type: object
      required: [op_id, entidad, operacion, payload, creado_en]
      properties:
        op_id: { type: string, format: uuid, description: Clave de idempotencia }
        entidad:
          type: string
          description: Nombre de la tabla (el mismo que usa sync_cola en SQLite)
          enum: [servicios, favores, contactos, recomendaciones, reportes, emergencias, pedidos_ayuda, emergencia_acuses]
        operacion: { type: string, enum: [crear, actualizar, eliminar] }
        payload: { type: object, additionalProperties: true, description: Mismo cuerpo que el endpoint REST equivalente }
        creado_en: { type: string, format: date-time, description: Hora del dispositivo }
    ResultadoSync:
      type: object
      required: [op_id, resultado]
      properties:
        op_id: { type: string, format: uuid }
        resultado: { type: string, enum: [aplicada, duplicada, rechazada] }
        motivo: { type: string, nullable: true }
    CambiosSync:
      type: object
      required: [hasta, cambios]
      properties:
        hasta: { type: string, format: date-time, description: Guárdalo como cursor_pull }
        cambios:
          type: object
          properties:
            sectores: { type: array, items: { $ref: '#/components/schemas/Sector' } }
            usuarios: { type: array, items: { $ref: '#/components/schemas/VecinoPublico' } }
            servicios: { type: array, items: { $ref: '#/components/schemas/Servicio' } }
            recomendaciones: { type: array, items: { $ref: '#/components/schemas/Recomendacion' } }
            favores: { type: array, items: { $ref: '#/components/schemas/Favor' } }
            emergencias: { type: array, items: { $ref: '#/components/schemas/Emergencia' } }
            pedidos_ayuda: { type: array, items: { $ref: '#/components/schemas/PedidoAyuda' } }
            grupos_apoyo: { type: array, items: { $ref: '#/components/schemas/GrupoApoyo' } }